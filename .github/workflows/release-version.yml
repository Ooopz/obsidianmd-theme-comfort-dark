name: Publish new theme version

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - "*" # Push events to matching any tag format, i.e. 1.0, 20.15.10

# The default GITHUB_TOKEN is read-only; creating a release needs write access.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Guards against releasing a tag that doesn't match what Obsidian will read.
      - name: Verify tag matches manifest version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(jq -r .version manifest.json)"
          echo "tag=$tag manifest.json=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag '$tag' does not match manifest.json version '$version'"
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            manifest.json
            theme.css
